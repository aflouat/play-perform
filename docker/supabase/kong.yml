# Passerelle API : expose Auth et REST sous une URL unique, comme Supabase cloud.
_format_version: "1.1"
services:
  - name: auth-v1-open
    url: http://auth:9999/verify
    routes: [{ name: auth-v1-open, strip_path: true, paths: [/auth/v1/verify] }]
    plugins: [{ name: cors }]
  - name: auth-v1-open-callback
    url: http://auth:9999/callback
    routes: [{ name: auth-v1-open-callback, strip_path: true, paths: [/auth/v1/callback] }]
    plugins: [{ name: cors }]
  - name: auth-v1-open-authorize
    url: http://auth:9999/authorize
    routes: [{ name: auth-v1-open-authorize, strip_path: true, paths: [/auth/v1/authorize] }]
    plugins: [{ name: cors }]
  - name: auth-v1
    url: http://auth:9999/
    routes: [{ name: auth-v1-all, strip_path: true, paths: [/auth/v1/] }]
    plugins: [{ name: cors }]
  - name: rest-v1
    url: http://rest:3000/
    routes: [{ name: rest-v1-all, strip_path: true, paths: [/rest/v1/] }]
    plugins: [{ name: cors }]
  - name: pg-meta
    url: http://meta:8080/
    routes: [{ name: pg-meta-all, strip_path: true, paths: [/pg/] }]
